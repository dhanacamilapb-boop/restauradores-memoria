<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Museo Melancolía - Parte 1</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2097/2097276.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0f19; font-family: 'Rajdhani', sans-serif;
    }
    #loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0b0f19; z-index: 9999; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: white; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 60px; height: 60px; border: 5px solid rgba(56, 189, 248, 0.2);
      border-top: 5px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #info-panel {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95); border: 1px solid #38bdf8; padding: 14px 24px;
      border-radius: 12px; color: white; display: none; z-index: 100; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    }
    #info-panel button {
      background: #38bdf8; border: none; padding: 8px 16px; margin: 4px;
      color: #0b0f19; font-weight: bold; border-radius: 6px; cursor: pointer; font-family: 'Rajdhani', sans-serif;
    }
    #info-panel button.btn-cerrar { background: #ef4444; color: white; }
  </style>
  <script>
    // Componente A-Frame para manejar clics interactivos
    AFRAME.registerComponent('click-obra', {
      schema: {
        nombre: {type: 'string', default: ''},
        modelId: {type: 'string', default: ''},
        ficha: {type: 'string', default: ''}
      },
      init: function () {
        var data = this.data;
        this.el.addEventListener('click', function () {
          window.seleccionarObra(data.nombre, data.modelId, data.ficha);
        });
      }
    });

    // ¡ESTE ES EL COMPONENTE QUE FALTABA! Componente para rotación continua al pasar el cursor
    AFRAME.registerComponent('girar-al-mirar', {
      init: function () {
        this.mirando = false;
        this.el.addEventListener('mouseenter', () => { this.mirando = true; });
        this.el.addEventListener('mouseleave', () => { this.mirando = false; });
      },
      tick: function (time, timeDelta) {
        if (this.mirando) {
          this.el.object3D.rotation.y += 0.03; 
        }
      }
    });
  </script>
</head>

  <script>
    let obraActualSeleccionada = "";
    let fichaActualSeleccionada = "";

    // ÚNICA función optimizada para recibir el nombre, el id del modelo y la ficha opcional
    window.seleccionarObra = function(nombre, modelId, rutaFicha) {
      obraActualSeleccionada = modelId;
      fichaActualSeleccionada = rutaFicha || "";

      document.getElementById('obra-titulo').textContent = nombre;
      
      // Muestra u oculta el botón "Ver Ficha" según si la obra tiene la ruta asignada
      const btnFicha = document.getElementById('btn-ver-ficha');
      if (btnFicha) {
        if (fichaActualSeleccionada !== "") {
          btnFicha.style.display = 'inline-block';
        } else {
          btnFicha.style.display = 'none';
        }
      }

      document.getElementById('info-panel').style.display = 'block';
    };

    function cerrarPanel() {
      document.getElementById('info-panel').style.display = 'none';
    }

    function verModeloSolo() {
      if (!obraActualSeleccionada) return;
      const assetItem = document.querySelector(obraActualSeleccionada);
      if (assetItem) {
        const srcUrl = assetItem.getAttribute('src');
        window.open(srcUrl, '_blank');
      }
    }

    // Función para abrir la ficha en una pestaña nueva
    function verFicha() {
      if (fichaActualSeleccionada) {
        window.open(fichaActualSeleccionada, '_blank');
      }
    }

    // Control de la pantalla de carga (Loader)
    window.addEventListener('load', () => {
      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) {
        ocultarLoader();
      } else {
        scene.addEventListener('loaded', ocultarLoader);
      }
    });

    function ocultarLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
      }
    }
  </script>
